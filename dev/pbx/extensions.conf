; A small office on FreePBX's pattern, for bin/dev-pbx. Staff: 101 Анна and 102 Борис in sales (ring group 600),
; 103 Вера in support (queue 700). There are no phones: a call file starts a Local channel pair whose ;2 half plays the
; outside caller (context caller), and the ;1 half runs from-trunk or from-internal, so the CDR shows what a trunk call
; does. Each employee's phone is a Local channel into phone-<scenario>, which answers, speaks or rings on as that
; scenario needs. Trunks and phones write no CDR rows of their own, so the stand-ins turn theirs off.
[general]
static=yes
writeprotect=yes

[caller]
exten => talk,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(9)
 same => n,Playback(dev/${SCEN}-client)
 same => n,Wait(40)
exten => ask,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(4)
 same => n,Playback(dev/${SCEN}-ask)
 same => n,Wait(40)
exten => message,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(22)
 same => n,Playback(dev/${SCEN}-message)
 same => n,Hangup()
exten => wait,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(40)
exten => quick,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(4)
 same => n,Hangup()

; FreePBX's file name and folder, on the caller's channel, so one file holds the call across a transfer. CDR(recordingfile)
; names it, as FreePBX sets it; `b` writes only while someone talks, so a missed call leaves no sound.
[start-recording]
exten => s,1,Set(RECFILE=${REC}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,Set(CDR(recordingfile)=${RECFILE})
 same => n,MixMonitor(${STRFTIME(${EPOCH},,%Y/%m/%d)}/${RECFILE},b)
 same => n,Return()

; A call file's channel is up from the start, which a trunk's or a phone's is not until someone answers. One more
; Local hop gives the CDR a first channel that is still ringing, so answer times come out as on a real PBX.
[from-trunk]
exten => _X.,1,Set(CDR_PROP(disable)=1)
 same => n,Dial(Local/${EXTEN}@trunk/n)

[trunk]
exten => _X.,1,Set(__REC=in-${EXTEN}-${CALLERID(num)})
 same => n,Gosub(start-recording,s,1)
 same => n,Goto(route,${EXTEN},1)

[from-internal]
exten => _X.,1,Set(CDR_PROP(disable)=1)
 same => n,Dial(Local/${EXTEN}@internal/n)

[internal]
exten => _1XX,1,Set(__REC=internal-${EXTEN}-${CALLERID(num)})
 same => n,Gosub(start-recording,s,1)
 same => n,Goto(route,${EXTEN},1)
exten => _XXXXXX.,1,Set(__REC=out-${EXTEN}-${CALLERID(num)})
 same => n,Gosub(start-recording,s,1)
 same => n,Dial(Local/${EXTEN}@outside/n,20)
 same => n,Hangup()

[route]
exten => _1XX,1,Dial(Local/${EXTEN}@phone/n,15)
 same => n,Goto(voicemail,${EXTEN},1)
exten => 600,1,Dial(Local/101@member/n&Local/102@member/n,15)
 same => n,Goto(voicemail,600,1)
exten => 700,1,Answer()
 same => n,Queue(700,,,,30)
 same => n,Goto(voicemail,700,1)

; FreePBX reaches a ring group or queue member through a Local channel like this one.
[member]
exten => _1XX,1,Dial(Local/${EXTEN}@phone/n)

[voicemail]
exten => _X.,1,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,VoiceMail(${EXTEN}@default,s)
 same => n,Hangup()
 same => n(busy),Busy(3)

[phone]
exten => _1XX,1,Set(CDR_PROP(disable)=1)
 same => n,GotoIf(${DIALPLAN_EXISTS(phone-${SCEN},${EXTEN},1)}?phone-${SCEN},${EXTEN},1)
 same => n,Wait(60)

; An employee who answers: says hello, waits for the caller, answers them.
[answer]
exten => s,1,Answer()
 same => n,Playback(dev/${SCEN}-hello)
 same => n,Wait(${ARG1})
 same => n,Playback(dev/${SCEN}-reply)
 same => n,Wait(2)
 same => n,Hangup()

[phone-sales]
exten => 101,1,Wait(3)
 same => n,Gosub(answer,s,1(9))

[phone-repeat]
exten => 102,1,Wait(5)
 same => n,Gosub(answer,s,1(9))

[phone-anonymous]
exten => 102,1,Wait(2)
 same => n,Gosub(answer,s,1(9))

[phone-support]
exten => 103,1,Wait(6)
 same => n,Gosub(answer,s,1(9))
exten => 101,1,Wait(60)

[phone-busy]
exten => 102,1,Busy(3)

[phone-transfer]
exten => 101,1,Wait(2)
 same => n,Answer()
 same => n,Playback(dev/${SCEN}-hello)
 same => n,Wait(30)
exten => 103,1,Wait(3)
 same => n,Answer()
 same => n,Playback(dev/${SCEN}-reply)
 same => n,Wait(3)
 same => n,Hangup()

[phone-internal]
exten => 102,1,Wait(2)
 same => n,Gosub(answer,s,1(6))

[outside]
exten => _X.,1,Set(CDR_PROP(disable)=1)
 same => n,GotoIf(${DIALPLAN_EXISTS(outside-${SCEN},s,1)}?outside-${SCEN},s,1)
 same => n,Wait(60)

[outside-callback]
exten => s,1,Wait(4)
 same => n,Gosub(answer,s,1(8))

[outside-order]
exten => s,1,Wait(2)
 same => n,Gosub(answer,s,1(8))
