; Test calls without phones: bin/dev-pbx drops call files that start a Local channel pair. The ;1 half runs
; from-trunk or from-internal, so the CDR shows an outside number and an extension, as a real trunk call does.
; The other halves stand in for a trunk and for phones, which write no CDR rows of their own, so theirs are off.
[general]
static=yes
writeprotect=yes

[caller]
exten => talk,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(6)
 same => n,Playback(dev/client)
 same => n,Wait(20)
exten => ask,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(3)
 same => n,Playback(dev/ask)
 same => n,Wait(20)
exten => wait,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Wait(30)

[from-trunk]
exten => _X.,1,Set(__CALL=${UNIQUEID})
 same => n,Set(__REC=in-${EXTEN}-${CALLERID(num)})
 same => n,Dial(Local/${EXTEN}@phones/n,10)
 same => n,Hangup()

[from-internal]
exten => _X.,1,Set(__CALL=${UNIQUEID})
 same => n,Set(__REC=out-${EXTEN}-${CALLERID(num)})
 same => n,Dial(Local/${EXTEN}@outside/n,10)
 same => n,Hangup()

; FreePBX's file name, <dir>-<to>-<from>-<date>-<time>-<uniqueid>.wav under a date folder.
[record]
exten => s,1,MixMonitor(${STRFTIME(${EPOCH},,%Y/%m/%d)}/${REC}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALL}.wav)
 same => n,Return()

[phones]
exten => 101,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Gosub(record,s,1)
 same => n,Playback(dev/operator)
 same => n,Wait(7)
 same => n,Playback(dev/reply)
 same => n,Hangup()
exten => 102,1,Set(CDR_PROP(disable)=1)
 same => n,Wait(30)
exten => 103,1,Set(CDR_PROP(disable)=1)
 same => n,Busy(3)

[outside]
exten => _X.,1,Set(CDR_PROP(disable)=1)
 same => n,Answer()
 same => n,Gosub(record,s,1)
 same => n,Playback(dev/warehouse)
 same => n,Wait(7)
 same => n,Playback(dev/ship)
 same => n,Hangup()
